<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>JAN棚卸</title>
<style>
  :root {
    --bg: #f6f7f5; --panel: #ffffff; --fg: #1d2420; --muted: #5d6a63;
    --line: #d5dbd7; --accent: #1f6b4f; --warn: #a15c00; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121614; --panel: #1b211e; --fg: #e6ece8; --muted: #9aa8a0;
      --line: #2d3732; --accent: #5cc49a; --warn: #f0b05a; --err: #f28b82; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 18px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .row > label { flex: 1 1 140px; min-width: 0; }
  label { display: block; font-size: 13px; color: var(--muted); }
  input { width: 100%; font-size: 17px; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--fg); }
  button { font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { font-size: 13px; padding: 4px 10px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; }
  #reader { width: 100%; max-width: 480px; margin-top: 12px; }
  #last .name { font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
  #last .meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .status { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .status.err { color: var(--err); }
  .unknown { color: var(--warn); font-weight: 600; }
  ul#hist { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  ul#hist li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  ul#hist li span:first-child { min-width: 0; overflow-wrap: anywhere; }
  ul#hist li span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
  <h1><span>JAN棚卸（試作）</span><button id="resetBtn" class="small" type="button" hidden>接続を解除</button></h1>

  <div id="needConn" class="panel" hidden>
    <strong>まだ接続されていません。</strong>
    <div style="margin-top:4px">店の担当者から配られた「接続用QRコード」をスマホのカメラで読んで、このページを開き直してください。</div>
  </div>

  <div id="app" hidden>
    <div class="row">
      <label>担当<input id="staff" placeholder="例：信香" autocomplete="off"></label>
      <label>場所・棚<input id="loc" placeholder="例：店内A-1" autocomplete="off"></label>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="camBtn" class="primary" type="button">カメラで読む</button>
      <label style="flex:1 1 180px">スキャナー・手入力（JANを入れてEnter）
        <input id="kbd" inputmode="numeric" autocomplete="off" placeholder="ここにスキャナーで読む">
      </label>
    </div>
    <div id="reader"></div>

    <div id="last" class="panel" hidden>
      <div class="name" id="lastName"></div>
      <div class="meta" id="lastMeta"></div>
      <div id="registerBox" hidden style="margin-top:8px">
        <div class="unknown">まだ登録されていないJANです。商品名を入れてください。</div>
        <div class="row" style="margin-top:6px">
          <label>商品名<input id="newName" autocomplete="off"></label>
          <button id="regBtn" class="primary" type="button">登録して1本追加</button>
        </div>
      </div>
      <div id="qtyBox" class="row" style="margin-top:10px">
        <div><div style="font-size:13px;color:var(--muted)">この場所の数</div><div class="big" id="lastCount">0</div></div>
        <button type="button" data-d="-1">−1</button>
        <button type="button" data-d="1">＋1</button>
        <label style="flex:0 1 110px">まとめて追加<input id="bulk" inputmode="numeric" placeholder="例：12"></label>
        <button type="button" id="bulkBtn">追加</button>
      </div>
    </div>

    <div class="status" id="status">準備中…</div>

    <div class="panel">
      <div style="font-size:13px;color:var(--muted);margin-bottom:4px">この端末で読んだ記録（新しい順）</div>
      <ul id="hist"></ul>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+" crossorigin="anonymous"></script>
<script>
  // 接続先（スクリプトのURL）と合言葉は、接続用QRのURLの # 以降で受け取り、この端末にだけ保存する
  //   例：https://<GitHubのユーザー名>.github.io/jan-tanaoroshi/#c=<URLエンコードした「スクリプトURL|合言葉」>
  var conn = null;
  var master = {};          // JAN -> 商品名
  var counts = {};          // 場所|JAN -> この端末で数えた数
  var current = null;       // 画面に出している商品 {jan, name}
  var lastHit = { code: '', at: 0 };
  var queue = [], sending = false;
  var scanner = null, camOn = false;

  var $ = function (id) { return document.getElementById(id); };
  function setStatus(t, err) { $('status').textContent = t; $('status').className = 'status' + (err ? ' err' : ''); }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function forget(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function readConn() {
    var m = location.hash.match(/^#c=(.+)$/);
    if (m) {
      var raw = decodeURIComponent(m[1]);
      var i = raw.lastIndexOf('|');
      if (i > 0 && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(raw.slice(0, i))) store('conn', raw);
      history.replaceState(null, '', location.pathname);   // アドレス欄から合言葉を消す
    }
    var saved = load('conn');
    var j = saved.lastIndexOf('|');
    return j > 0 ? { url: saved.slice(0, j), pass: saved.slice(j + 1) } : null;
  }

  // すべてPOST（text/plain）で送る。合言葉はURLに載せない
  function api(body) {
    return fetch(conn.url, { method: 'POST', body: JSON.stringify(Object.assign({ pass: conn.pass }, body)) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error || '失敗しました');
        return d;
      });
  }

  conn = readConn();
  if (!conn) { $('needConn').hidden = false; }
  else {
    $('app').hidden = false; $('resetBtn').hidden = false;
    $('staff').value = load('staff');
    $('loc').value = load('loc');
    api({ action: 'master' }).then(function (d) { master = d.master || {}; setStatus('商品マスタ ' + Object.keys(master).length + '件を読み込みました'); })
      .catch(function (e) { setStatus('商品マスタを読み込めませんでした：' + e.message, true); });
  }

  $('resetBtn').addEventListener('click', function () { forget('conn'); location.reload(); });
  $('staff').addEventListener('change', function () { store('staff', this.value.trim()); });
  $('loc').addEventListener('change', function () { store('loc', this.value.trim()); });

  function beep() {
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    try {
      var ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 1800; g.gain.value = 0.08; o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.08);
    } catch (e) {}
  }

  function handleCode(raw) {
    var code = String(raw || '').trim();
    if (!code) return;
    // 「場所:店内A-1」のような棚QRなら場所を切り替える
    var m = code.match(/^場所[:：](.+)$/);
    if (m) { $('loc').value = m[1].trim(); store('loc', m[1].trim()); beep(); setStatus('場所を「' + m[1].trim() + '」にしました'); return; }
    if (!/^\d{8,14}$/.test(code)) { setStatus('JANではないコードです：' + code, true); return; }
    if (!$('staff').value.trim() || !$('loc').value.trim()) { setStatus('先に担当と場所を入れてください', true); return; }
    beep();
    current = { jan: code, name: master[code] || '' };
    if (current.name) { addQty(1); } else { showCurrent(); $('newName').focus(); }
  }

  function key() { return $('loc').value.trim() + '|' + current.jan; }

  function addQty(d) {
    if (!current || !current.name || !d) return;
    var k = key();
    counts[k] = (counts[k] || 0) + d;
    queue.push({ staff: $('staff').value.trim(), loc: $('loc').value.trim(), jan: current.jan, name: current.name, qty: d });
    addHist(current.name + '（' + $('loc').value.trim() + '）', d);
    showCurrent();
    pump();
  }

  function showCurrent() {
    $('last').hidden = false;
    var known = !!current.name;
    $('lastName').textContent = known ? current.name : 'JAN ' + current.jan;
    $('lastMeta').textContent = 'JAN ' + current.jan + '　場所：' + $('loc').value.trim();
    $('registerBox').hidden = known;
    $('qtyBox').hidden = !known;
    $('lastCount').textContent = counts[key()] || 0;
  }

  function addHist(label, d) {
    var li = document.createElement('li');
    var a = document.createElement('span'); a.textContent = label;
    var b = document.createElement('span'); b.textContent = (d > 0 ? '＋' : '') + d;
    li.appendChild(a); li.appendChild(b);
    $('hist').insertBefore(li, $('hist').firstChild);
    while ($('hist').children.length > 30) $('hist').removeChild($('hist').lastChild);
  }

  // たまった記録をまとめて送る（失敗したら5秒後にもう一度）
  function pump() {
    if (sending || !queue.length) return;
    sending = true;
    var batch = queue.slice(0, 50);
    setStatus('送信中… 残り ' + queue.length + '件');
    api({ action: 'scans', rows: batch })
      .then(function () {
        queue.splice(0, batch.length); sending = false;
        setStatus(queue.length ? '送信中… 残り ' + queue.length + '件' : 'スプレッドシートに記録しました');
        pump();
      })
      .catch(function (e) { sending = false; setStatus('送信できませんでした（5秒後にもう一度送ります）：' + e.message, true); setTimeout(pump, 5000); });
  }

  window.addEventListener('beforeunload', function (e) { if (queue.length) { e.preventDefault(); e.returnValue = ''; } });

  document.querySelectorAll('#qtyBox button[data-d]').forEach(function (b) {
    b.addEventListener('click', function () { addQty(Number(b.getAttribute('data-d'))); });
  });
  $('bulkBtn').addEventListener('click', function () {
    var n = parseInt($('bulk').value, 10);
    if (n) { addQty(n); $('bulk').value = ''; }
  });

  $('regBtn').addEventListener('click', function () {
    var name = $('newName').value.trim();
    if (!name || !current) { setStatus('商品名を入れてください', true); return; }
    $('regBtn').disabled = true;
    api({ action: 'register', jan: current.jan, name: name })
      .then(function (d) {
        $('regBtn').disabled = false; $('newName').value = '';
        master[current.jan] = d.name; current.name = d.name; addQty(1);
      })
      .catch(function (e) { $('regBtn').disabled = false; setStatus('登録できませんでした：' + e.message, true); });
  });

  // Bluetoothスキャナー（キーボード入力型）・手入力
  $('kbd').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); handleCode(this.value); this.value = ''; }
  });

  // カメラ：開いたまま連続で読む。同じコードは2秒間は無視（二重カウント防止）
  $('camBtn').addEventListener('click', function () {
    if (camOn) { scanner.stop().then(function () { camOn = false; $('camBtn').textContent = 'カメラで読む'; }); return; }
    if (!window.Html5Qrcode) { setStatus('読み取り部品を読み込めませんでした。通信状況を確認して開き直してください', true); return; }
    var F = Html5QrcodeSupportedFormats;
    scanner = scanner || new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.QR_CODE], verbose: false });
    scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } },
      function (text) {
        var now = Date.now();
        if (text === lastHit.code && now - lastHit.at < 2000) return;
        lastHit = { code: text, at: now };
        handleCode(text);
      }, function () {})
      .then(function () { camOn = true; $('camBtn').textContent = 'カメラを止める'; setStatus('カメラ起動中。バーコードを枠に入れてください'); })
      .catch(function (e) { setStatus('カメラを使えませんでした：' + e, true); });
  });
</script>
</body>
</html>
